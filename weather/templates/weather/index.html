<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="{% static 'weather/css/style.css' %}" rel="stylesheet">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-4">
                        <h1 class="card-title text-center mb-4">
                            <i class="fas fa-cloud-sun text-primary me-2"></i>
                            Weather App
                        </h1>
                        
                        <!-- Search Form -->
                        <form id="weatherForm" class="mb-4">
                            <div class="input-group">
                                <input type="text" 
                                       id="cityInput" 
                                       class="form-control form-control-lg" 
                                       placeholder="Enter city name (e.g., London, New York)" 
                                       required>
                                <button class="btn btn-primary btn-lg" type="submit">
                                    <i class="fas fa-search me-2"></i>Get Weather
                                </button>
                            </div>
                        </form>
                        
                        <!-- Loading Spinner -->
                        <div id="loadingSpinner" class="text-center d-none">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2 text-muted">Fetching weather data...</p>
                        </div>
                        
                        <!-- Error Message -->
                        <div id="errorMessage" class="alert alert-danger d-none" role="alert">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            <span id="errorText"></span>
                        </div>
                        
                        <!-- Weather Display -->
                        <div id="weatherCard" class="d-none">
                            <div class="row">
                                <div class="col-12">
                                    <div class="d-flex align-items-center justify-content-between mb-3">
                                        <div>
                                            <h2 id="cityName" class="mb-0 fw-bold"></h2>
                                            <p id="countryName" class="text-muted mb-0"></p>
                                        </div>
                                        <div class="text-end">
                                            <h3 id="temperature" class="mb-0 display-4 fw-light"></h3>
                                            <p class="text-muted mb-0">°C</p>
                                        </div>
                                    </div>
                                    
                                    <div class="d-flex align-items-center mb-3">
                                        <i class="fas fa-cloud me-3 fs-4 text-secondary"></i>
                                        <span id="weatherCondition" class="fs-5"></span>
                                    </div>
                                    
                                    <div class="row text-center">
                                        <div class="col-6">
                                            <div class="weather-detail">
                                                <i class="fas fa-thermometer-half text-danger"></i>
                                                <div class="mt-2">
                                                    <div class="fw-bold" id="apparentTemperature"></div>
                                                    <small class="text-muted">Feels Like</small>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <div class="weather-detail">
                                                <i class="fas fa-tint text-info"></i>
                                                <div class="mt-2">
                                                    <div class="fw-bold" id="humidity"></div>
                                                    <small class="text-muted">Humidity</small>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="text-center mt-4 text-muted">
                    <small>Data provided by Open-Meteo API</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="{% static 'weather/js/weather.js' %}"></script>
</body>
</html>
